AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Daily TimeGuess - a daily "guess when & where this photo was taken" game.
  A scheduled Lambda builds each day's 5-photo puzzle from Wikimedia Commons and
  stores it in S3; a game API (API Gateway HTTP API + Lambda + DynamoDB) serves
  it and scores guesses. Fully serverless and scale-to-zero.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Architectures:
      - arm64

Parameters:
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin. Lock this to your site once deployed.
  BuildSchedule:
    Type: String
    Default: "cron(0 0 * * ? *)"
    Description: When to build each day's puzzle (default 00:00 UTC daily).
  RoundsPerDay:
    Type: Number
    Default: 5
    Description: Photos per daily puzzle.
  AllowDateOverride:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Allow the ?date= replay override on the puzzle API. Keep "false" for a
      live game; set "true" only for local testing or replaying past editions.
  DomainName:
    Type: String
    Default: "theatlasnewspaper.co.uk"
    Description: Apex domain the game is served from (also serves www.<domain>).
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN of an ISSUED ACM certificate in us-east-1 covering the domain and
      www.<domain>. Required for CloudFront to serve the custom domain over HTTPS.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the domain (for the alias records).

Resources:
  # --- Storage ----------------------------------------------------------------

  PuzzleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "daily-timeguess-${AWS::AccountId}"
      # The bucket is fully private. Nothing is public: the frontend (web/) and
      # images (images/*) reach players only through CloudFront via Origin
      # Access Control, and the puzzle JSON / geocode cache are read only by the
      # game Lambda over IAM. No object is ever served from an S3 URL.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  PuzzleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PuzzleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Only this CloudFront distribution may read the frontend and images.
          # The puzzle JSON (with answers) and the geocode cache aren't granted
          # here at all - and CloudFront never requests them, since the only
          # behaviour that hits the bucket root is /images/* (the site behaviour
          # is scoped to the web/ prefix). So answers stay unreachable from the web.
          - Sid: CloudFrontReadSiteAndImages
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource:
              - !Sub "arn:aws:s3:::daily-timeguess-${AWS::AccountId}/images/*"
              - !Sub "arn:aws:s3:::daily-timeguess-${AWS::AccountId}/web/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # One row per (team, puzzleId): a team's score for a given day. Query by team
  # for that team's history; scan for the global best-10 across all teams.
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: team
          AttributeType: S
        - AttributeName: puzzleId
          AttributeType: S
      KeySchema:
        - AttributeName: team
          KeyType: HASH
        - AttributeName: puzzleId
          KeyType: RANGE

  # --- API --------------------------------------------------------------------

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # --- Game Lambda ------------------------------------------------------------

  GameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          SCORES_TABLE: !Ref ScoresTable
          PUZZLE_BUCKET: !Ref PuzzleBucket
          ALLOW_DATE_OVERRIDE: !Ref AllowDateOverride
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - S3ReadPolicy:
            BucketName: !Ref PuzzleBucket
      Events:
        GetPuzzle:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /api/puzzle/today
        PostGuess:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /api/guess
        PostScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /api/scores
        GetTeamScores:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /api/scores/team/{team}

  # --- Daily puzzle builder Lambda --------------------------------------------

  DailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/daily/
      Handler: app.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          PUZZLE_BUCKET: !Ref PuzzleBucket
          ROUNDS_PER_DAY: !Ref RoundsPerDay
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PuzzleBucket
      Events:
        DailyBuild:
          Type: Schedule
          Properties:
            Schedule: !Ref BuildSchedule
            Description: Build the day's TimeGuess puzzle
            Enabled: true

  # --- CDN + custom domain ----------------------------------------------------

  # Lets CloudFront (and only CloudFront) read the private S3 bucket.
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "daily-timeguess-${AWS::AccountId}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # One domain for everything: the page, the API and the images share an origin,
  # so there's no CORS and no S3/account details are ever exposed to players.
  #   /            -> S3 web/  (the single-page frontend)
  #   /images/*    -> S3 images/  (the day's re-hosted photos)
  #   /api/*       -> API Gateway (puzzle + scoring)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: The Atlas - daily when-and-where game
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # The frontend lives under the web/ prefix; origin path maps / to it.
          - Id: SiteOrigin
            DomainName: !GetAtt PuzzleBucket.RegionalDomainName
            OriginPath: /web
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # Same bucket, no prefix - serves images/* straight from the root.
          - Id: AssetsOrigin
            DomainName: !GetAtt PuzzleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${Api}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /images/*
            TargetOriginId: AssetsOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            # Managed CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            # Managed CachingDisabled + AllViewerExceptHostHeader so the API
            # gets the body, query string and headers but its own Host.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # Point the apex and www at CloudFront (alias records are free in Route 53).
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed CloudFront alias zone
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: The live game URL.
    Value: !Sub "https://${DomainName}"
  DistributionDomainName:
    Description: CloudFront domain (works before DNS/cert are live).
    Value: !GetAtt Distribution.DomainName
  ApiUrl:
    Description: Base URL for the Daily TimeGuess API.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  PuzzleBucketName:
    Description: S3 bucket holding daily puzzles and re-hosted images.
    Value: !Ref PuzzleBucket
  ScoresTableName:
    Description: DynamoDB table storing each team's daily scores.
    Value: !Ref ScoresTable
